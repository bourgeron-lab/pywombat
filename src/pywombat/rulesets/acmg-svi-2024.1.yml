# REVEL cut-offs from Pejaver 2022, Table 2.
# SpliceAI cut-offs from Walker 2023.

name: acmg-svi-2024.1
framework: points
points:
  supporting: 1
  moderate: 2
  strong: 4
  very_strong: 8

frequency:
  column: fafmax_faf95_max_joint
  ba1: 0.05
  ac_column: AC_joint
  an_column: AN_joint
  absent_needs_an: 20000

predictor:
  name: REVEL
