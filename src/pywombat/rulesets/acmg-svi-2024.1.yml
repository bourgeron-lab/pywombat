  pp3:
    supporting: 0.644
    moderate: 0.773
    strong: 0.932
  bp4:
    supporting: 0.290
    moderate: 0.183
    strong: 0.016
    very_strong: 0.003

splice:
  column: SpliceAI_maxDS
  pp3_min: 0.2
  bp4_max: 0.1
